name: Windows

# Builds the Windows exes with the same TCC toolchain the .bat files use, so
# nobody needs a local compiler: download the zip from the run artifact, or —
# after a master build — from the "windows-latest" release.
#
# The zip deliberately does NOT contain zelda3_assets.dat (derived from the
# copyrighted ROM); the packaged README explains the one-time extraction.

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (TCC)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Download TCC and SDL2
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri 'https://github.com/FitzRoyX/tinycc/releases/download/tcc_20221020/tcc_20221020.zip' -OutFile tcc.zip
        Expand-Archive tcc.zip -DestinationPath third_party
        if (!(Test-Path 'third_party/tcc/tcc.exe')) {
          # Tolerate an extra nesting level inside the zip.
          $exe = Get-ChildItem third_party -Recurse -Filter tcc.exe | Select-Object -First 1
          if (!$exe) { Get-ChildItem third_party -Recurse | Select-Object FullName; throw 'tcc.exe not found in the downloaded zip' }
          Move-Item $exe.Directory.FullName third_party/tcc
        }
        Invoke-WebRequest -Uri 'https://github.com/libsdl-org/SDL/releases/download/release-2.26.3/SDL2-devel-2.26.3-VC.zip' -OutFile sdl2.zip
        Expand-Archive sdl2.zip -DestinationPath third_party
        if (!(Test-Path 'third_party/SDL2-2.26.3/lib/x64/SDL2.dll')) { throw 'SDL2 zip layout unexpected' }

    - name: Build vanilla (zelda3.exe)
      shell: cmd
      run: third_party\tcc\tcc.exe -ozelda3.exe -DCOMPILER_TCC=1 -DSTBI_NO_SIMD=1 -DHAVE_STDINT_H=1 -D_HAVE_STDINT_H=1 -DSYSTEM_VOLUME_MIXER_AVAILABLE=0 -Ithird_party\SDL2-2.26.3/include -Lthird_party\SDL2-2.26.3/lib/x64 -lSDL2 -I. src/*.c snes/*.c third_party/gl_core/gl_core_3_1.c third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c

    - name: Build co-op (zelda3_coop.exe)
      shell: cmd
      run: third_party\tcc\tcc.exe -ozelda3_coop.exe -DCOMPILER_TCC=1 -DSTBI_NO_SIMD=1 -DHAVE_STDINT_H=1 -D_HAVE_STDINT_H=1 -DSYSTEM_VOLUME_MIXER_AVAILABLE=0 -DZELDA3_MULTIPLAYER=1 -Ithird_party\SDL2-2.26.3/include -Lthird_party\SDL2-2.26.3/lib/x64 -lSDL2 -lws2_32 -I. src/*.c snes/*.c third_party/gl_core/gl_core_3_1.c third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory dist | Out-Null
        Copy-Item zelda3_coop.exe, zelda3.exe, zelda3.ini, third_party/SDL2-2.26.3/lib/x64/SDL2.dll dist/
        @'
        ZELDA 3 CO-OP - Windows x64
        ===========================

        FILES
          zelda3_coop.exe   The game: single-player AND two-player co-op. Use this one.
          zelda3.exe        The untouched original port (no co-op), as a backup.
          SDL2.dll          Required. Keep it next to the exe.
          zelda3.ini        Settings (controls, window size, audio).

        ONE-TIME SETUP: GAME ASSETS (required before the game will start)
          The game data comes from your own ROM and is not included here.
          1) Get the source repo: https://github.com/zacharyso-design/zelda3-coop
          2) Put your USA ROM named  zelda3.sfc  in the repo folder
          3) Install Python 3, then in a terminal:  pip install Pillow
          4) Double-click  extract_assets.bat  ->  creates  zelda3_assets.dat
          5) Copy  zelda3_assets.dat  into THIS folder, next to zelda3_coop.exe

        PLAY
          Co-op (default)  Double-click zelda3_coop.exe. Player 2 (red Link)
                           appears beside Player 1 once the game starts.
                           P1: first controller, or arrows + Z/X/A/S.
                           P2: second controller, or the numpad (NumLock ON:
                           8/2/4/6 move, 5 = sword, 0 = lift/run).
          Solo             zelda3_coop.exe --solo   (no Player 2)
          Online co-op     zelda3_coop.exe --online and follow the menu: one
                           player hosts (a JOIN CODE prints and shows in the
                           window title), the other picks "Join with a code".
                           Internet play routes through a relay server
                           (tools/relay.py in the repo); same-LAN play needs
                           no relay.

          Tip: to pass --solo or --online, make a shortcut to zelda3_coop.exe,
          open its Properties, and add the flag at the end of the Target box.

        Full manual: BUILD_AND_PLAY.md and NET_ONLINE.md in the repo.
        '@ | Set-Content dist/README_FIRST.txt
        Compress-Archive -Path dist/* -DestinationPath zelda3-coop-windows-x64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: zelda3-coop-windows-x64
        path: dist/*

    - name: Publish "windows-latest" release
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view windows-latest *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create windows-latest --title 'Windows build (latest)' --notes 'Prebuilt Windows exes, auto-updated on every master build. Download zelda3-coop-windows-x64.zip and read README_FIRST.txt inside (you still extract game assets from your own ROM once).'
        }
        gh release upload windows-latest zelda3-coop-windows-x64.zip --clobber
